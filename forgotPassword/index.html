<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Recuperar Senha | Nexora</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div id="bg-loader" aria-hidden="true">
      <div id="bg-spinner"></div>
    </div>
    <div id="container">
      <form id="forgot-box">
        <h1>Recuperar senha</h1>
        <p class="subtitle">Digite seu e-mail para receber as instruções</p>

        <label for="emailInput">E-Mail</label>
        <input
          type="email"
          id="emailInput"
          name="email"
          placeholder="example@gmail.com"
          autocomplete="email"
          required
        />

        <button type="submit">Enviar</button>
        <div class="user-help">
          <span
            >Lembrou da sua senha?
            <a href="../login/index.html">Faça Login</a></span
          >
          <span
            >Entre em contato com o nosso
            <a href="../support/index.html">Suporte</a></span
          >
        </div>
      </form>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="../users.js"></script>
    <script src="script.js"></script>
  </body>
</html>
