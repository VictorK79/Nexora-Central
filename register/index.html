<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Document</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link rel="stylesheet" href="style.css" />

</head>

<body>
  <div id="container">
    <form id="register">
      <div id="name-row">
        <div class="name-child">
          <label>Nome</label>
          <input type="text" name="nome" id="nome" placeholder="Victor">
        </div>
        <div class="name-child">
          <label>Sobrenome</label>
          <input type="text" name="sobrenome" id="sobrenome" placeholder="Lima">
        </div>
      </div>
      <div id="email-row">
        <label>E-Mail</label>
        <input type="text" name="email" id="emailInput" placeholder="example@gmail.com">
      </div>
      <div id="address-row">
        <div class="address-child">
          <label>Endereço</label>
          <input type="text" name="endereco" id="endereco" placeholder="Rua São José">
        </div>
        <div class="district-child">
          <label>Bairro</label>
          <input type="text" name="bairro" id="bairro" placeholder="Centro">
        </div>
        <div class="number-child">
          <label>Número</label>
          <input type="text" name="numero" id="numero" placeholder="456">
        </div>
      </div>
      <div id="passwords">
        <label>Senha</label>

        <div class="password-box">
          <input type="password" id="senha" placeholder="Crie senhas com no mínimo 8 caracteres.">
          <i class="fa-solid fa-eye eye"></i>
        </div>
  
        <p>Confirme Novamente a Senha</p>

        <div class="password-box">
          <input type="password" id="confirmar" placeholder="Crie senhas com no mínimo 8 caracteres.">
          <i class="fa-solid fa-eye eye"></i>
        </div>
        <p id="statePassword">&nbsp</p>
      </div>
      <div id="terms">
        <input type="checkbox" name="termos" id="termos" />
        <label for="termos"><p>Eu aceito os&nbsp<a href="#">
            termos e condições, política de privacidade e política de
            cookies</a></p></label>
      </div>
      <button id="registre">Registre</button>
      <span>Já possui uma conta?
        <a href="../login/index.html">Faça Login</a></span>
    </form>
  </div>
  <script src="../users.js"></script>
  <script src="script.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</body>

</html>
